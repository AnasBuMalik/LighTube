<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل يوتيوب خفيف</title>
    <style>
        /* الحد الأدنى من التنسيقات لضمان الأداء */
        body { margin:0; font-family:system-ui, sans-serif; background:#000; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
        input { width:80%; max-width:500px; padding:10px; font-size:16px; margin-bottom:8px; background:#111; color:#fff; border:1px solid #333; border-radius:4px; outline:none; }
        button { padding:10px 25px; font-size:16px; background:#c00; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-bottom:10px; }
        #player { width:100%; max-width:800px; }
        iframe { width:100%; height:400px; border:none; }
    </style>
</head>
<body>

    <input type="text" id="urlInput" placeholder="الصق رابط يوتيوب هنا واضغط Enter" autofocus>
    <button id="playBtn">تشغيل</button>
    <div id="player"></div>

    <script>
        (function() {
            const input = document.getElementById('urlInput');
            const playerDiv = document.getElementById('player');
            const playBtn = document.getElementById('playBtn');

            // استخراج معرف الفيديو من أي صيغة رابط يوتيوب
            function extractVideoId(url) {
                const patterns = [
                    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/|youtube\.com\/live\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
                    /youtube\.com\/watch\?.*[?&]v=([a-zA-Z0-9_-]{11})/
                ];
                for (const pattern of patterns) {
                    const match = url.match(pattern);
                    if (match) return match[1];
                }
                return null;
            }

            function playVideo() {
                const url = input.value.trim();
                if (!url) return;

                const videoId = extractVideoId(url);
                if (!videoId) {
                    alert('رابط غير صالح. تأكد من أن الرابط صحيح.');
                    return;
                }

                // مسح المشغل السابق لتحرير الذاكرة
                playerDiv.innerHTML = '';

                const iframe = document.createElement('iframe');
                // أهم إضافة: mute=1 حتى يتم التشغيل التلقائي بدون صوت، ويتمكن المستخدم من رفع الصوت لاحقًا
                // كما نضيف origin لتفادي أخطاء التضمين، وplaysinline ليعمل على الجوال بسلاسة
                iframe.src = 'https://www.youtube-nocookie.com/embed/' + videoId +
                             '?autoplay=1&mute=1&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&origin=' +
                             encodeURIComponent(window.location.origin);

                iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
                iframe.setAttribute('allowfullscreen', '');
                iframe.setAttribute('loading', 'eager'); // التحميل الفوري لتجنب تأخير
                iframe.title = 'YouTube video player';
                iframe.style.width = '100%';
                iframe.style.height = '400px';
                iframe.style.border = 'none';

                playerDiv.appendChild(iframe);

                // إعادة التركيز للحقل
                input.focus();
                input.select();
            }

            // ربط الأحداث
            playBtn.addEventListener('click', playVideo);
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') playVideo();
            });

            // تركيز أولي
            input.focus();
        })();
    </script>
</body>
</html>
